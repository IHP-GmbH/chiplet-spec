#
# Conformance corpus: the format_version policy (H-B seed, format-level, public).
# Home for the format-level fixtures per CHIPLET_FLOW_DEV_GUIDELINES Lane 2.
# Verdict-level (H-C) fixtures live elsewhere behind the embargo gate and are
# NOT part of this file.
#
# Implementation-class dimension (REQUIRED, fable change 6): the read verdict
# (accept/warn/refuse) and the normalized version apply to EVERY reader and are
# the cross-implementation parity contract. The writer and round-trip
# expectations are class-specific:
#   * passthrough readers/writers keep a lossless dict, so an unknown top-level
#     key round-trips and a same-major higher minor is preserved on write;
#   * typed readers/writers reconstruct from a struct model, so unknown keys are
#     dropped BY DESIGN (the 2026-08-05 stackup loss) and writers stamp SUPPORTED.
# An expectation tagged `passthrough_only: true` is checked only against a
# passthrough implementation and skipped (not failed) for a typed one.

# interposer_pnr_ir reads into a typed model but retains the raw dict and writes
# it back (write_assembly dumps assembly.raw), so it is passthrough for
# round-trip and writer purposes; only the C++ struct reader is typed-lossy
# (no raw retention). ir's writer parity is asserted in interposer-pnr's suite.
#
# Rule-8 dimension (`checks_pad_usage`): whether the reader implements validation
# rule 8, the io_class/interface-type compatibility check of the spec. It is a
# READER rule, not a structural one, and the two reference validators run it while
# ir does not (row open at interposer-pnr). An expectation tagged
# `pad_usage_only: true` is therefore skipped (not failed) for a reader that does
# not declare the dimension, exactly as `passthrough_only` and `source_text_only`
# are. The dimension is written down here rather than left implicit so the gap is
# visible in the parity contract instead of being invisible in a missing row.
#
# Source-text dimension (`reads_source_text`): whether the reader sees the BYTES
# of the document or only a parsed node tree. It decides one thing, and only one:
# whether the top-level block grammar (docs/CHIPLET_FORMAT_SPEC.md) is something
# the reader can apply at all. ir is handed an already-parsed mapping, so a
# repeated top-level key has been resolved away before it is called and it cannot
# be asked about it; an expectation tagged `source_text_only: true` is skipped
# (not failed) for such a reader, the same way `passthrough_only` is skipped for a
# typed one. Everything NOT so tagged applies to every reader, as before.
implementations:
  reference_python:   {class: passthrough, writes: true, reads_source_text: true,  checks_pad_usage: true}
  interposer_pnr_ir:  {class: passthrough, writes: true, reads_source_text: false, checks_pad_usage: false}
  reference_cpp:      {class: typed,       writes: true, reads_source_text: true,  checks_pad_usage: true}

fixtures:
  - file: v1_0_baseline.chiplet
    expect: accept
    version: "1.0"
    writer: stamp_supported

  - file: v1_0_unquoted_numeric.chiplet
    expect: accept
    version: "1.0"
    note: >-
      Unquoted 1.0 is coerced through str(). PyYAML renders unquoted 1.10 as
      "1.1" while yaml-cpp keeps "1.10"; the spec says the field MUST be quoted.

  - file: v1_0_additive_unknown_key.chiplet
    expect: accept
    version: "1.0"
    roundtrip_key: future_block
    roundtrip_key_passthrough_only: true

  - file: v1_0_assembly_two_die.chiplet
    expect: accept
    version: "1.0"
    note: >-
      A complete R1-emitted assembly (two SG13G2 dies on an IntM4TM2 interposer,
      full components + netlist), not a version stub: proves every reader accepts
      a realistic 1.0 document and normalizes to 1.0. Format-level ACCEPT,
      class-agnostic (no round-trip or writer expectation), so it is checked
      identically for passthrough and typed readers.

  - file: v1_0_all_blocks.chiplet
    expect: accept
    version: "1.0"
    note: >-
      Schema-coverage document: every canonical top-level block (all eleven root
      keys except _metadata). It is in the corpus so the structural schema
      (schemas/chiplet.schema.json, driven by test_chiplet_schema.py) and the
      reader parity are proved on the SAME file instead of on two that drift.
      Format-level ACCEPT, class-agnostic (no round-trip or writer expectation).

  - file: v1_1_higher_minor.chiplet
    expect: warn
    version: "1.1"
    writer: preserve_input
    writer_passthrough_only: true
    note: >-
      Passthrough writers preserve "1.1" and re-warn; typed writers stamp "1.0"
      because they may have dropped 1.1-only fields (the stamped version must
      describe the bytes written).

  - file: v2_0_higher_major.chiplet
    expect: refuse

  - file: v0_9_lower_major.chiplet
    expect: refuse

  - file: v1_0_missing_version.chiplet
    expect: refuse

  - file: v1_0_malformed_version.chiplet
    expect: refuse

  # Loadable, NOT splittable. Both spellings are structurally valid documents and
  # every reader must load them (flow rule 1: a reader that cannot handle the
  # flow block MUST NOT reject the document). What they cost is the text-level
  # work: the first cannot be split into top-level blocks at all, the second has
  # a flow node the grammar cannot delimit, and a writer that preserves the
  # block's source bytes refuses to write either back rather than drop the block
  # or emit a re-serialisation in its place. Those properties are pinned in
  # fixtures/top_level_blocks_cases.json; what belongs HERE is the read verdict,
  # which is the cross-implementation parity contract.
  - file: v1_0_quoted_key_at_column_zero.chiplet
    expect: accept
    version: "1.0"

  - file: v1_0_flow_not_delimitable.chiplet
    expect: accept
    version: "1.0"

  # Ill-formed on the TEXT and nowhere else: `flow` appears twice at column zero.
  # PyYAML resolves it to the last value and yaml-cpp to the first, so the two
  # reference readers would report different documents from these bytes and
  # neither the schema nor a parsed node tree can see that anything happened.
  # Refused at load by every reader that sees the source text.
  - file: v1_0_repeated_top_level_key.chiplet
    expect: refuse
    source_text_only: true

  # Validation rule 8 (io_class vs interfaces[].type). The pair is one case seen
  # from both sides: the same wire_bond pad and the same copper_pillar interface,
  # refused when the pad is on the endpoint's port_layer and accepted when it is
  # not. The accept row binds every reader; the refuse row binds only a reader
  # that declares checks_pad_usage, because rule 8 is a reader rule and ir has
  # not adopted it yet.
  - file: v1_0_interface_pad_other_layer.chiplet
    expect: accept
    version: "1.0"

  - file: v1_0_interface_pad_mismatch.chiplet
    expect: refuse
    pad_usage_only: true

  # Validation rule 9 (component connection -> method -> interfaces[].type), the
  # cross-artifact rule. No implementation listed above runs it: the method's
  # interface_type lives in the interconnect manifest and none of these readers
  # holds one. So the row that binds THEM is the accept, and it is a measured
  # fact rather than an endorsement: a reference reader has nothing to object to
  # in this document. `assembly_stage` carries the verdict the hosts that DO hold
  # the manifest owe (the plugin at export; adk-tools' assembly DRC, Mosaic and
  # chiplet-system at load), so the three of them are measured against this one
  # file instead of against each other. Nothing in this repository checks that
  # verdict; conformance/test_interface_binding.py says exactly that.
  - file: v1_0_interface_inconsistent_binding.chiplet
    expect: accept
    version: "1.0"
    assembly_stage:
      rule: 9
      expect: refuse
      why: >-
        U1 selects cupillar_opt1, a Cu-pillar method, and takes part in link0,
        an interface of type micro_bump.
